name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Swift iOS App
        run: |
          mkdir -p WebhookApp/WebhookApp
          
          # יצירת App base
          cat << 'EOF' > WebhookApp/WebhookApp/App.swift
          import SwiftUI
          import WebKit

          struct WebView: UIViewRepresentable {
              func makeUIView(context: Context) -> WKWebView {
                  let webView = WKWebView()
                  if let url = Bundle.main.url(forResource: "index", withExtension: "html") {
                      webView.loadFileURL(url, allowingReadAccessTo: url)
                  }
                  return webView
              }
              func updateUIView(_ uiView: WKWebView, context: Context) {}
          }

          @main
          struct WebhookApp: App {
              var body: some Scene {
                  WindowGroup {
                      WebView()
                          .ignoresSafeArea()
                  }
              }
          }
          EOF

          # העתקת קבצי ה-Web
          cp -r www/* WebhookApp/WebhookApp/

          # יצירת קובץ Info.plist
          cat << 'EOF' > WebhookApp/WebhookApp/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>WebhookApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.myapp.webhook</string>
              <key>CFBundleName</key>
              <string>WebhookApp</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          </plist>
          EOF

      - name: Compile Native iOS Binary
        run: |
          cd WebhookApp/WebhookApp
          
          # קימפול הקוד הבינארי עבור מעבדי ARM64 (אייפון)
          swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
                 -target arm64-apple-ios15.0 \
                 -emit-executable \
                 -o WebhookApp \
                 App.swift
          
          # יצירת ה-App Bundle
          mkdir -p ../../Payload/WebhookApp.app
          mv WebhookApp ../../Payload/WebhookApp.app/
          cp Info.plist ../../Payload/WebhookApp.app/
          cp -r index.html ../../Payload/WebhookApp.app/

      - name: Package to IPA
        run: |
          zip -r WebhookSender.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebhookSender-IPA
          path: WebhookSender.ipa
        
