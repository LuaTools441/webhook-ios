name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Create WebArchive App
        run: |
          mkdir -p Payload/WebhookApp.app
          cp -r www/* Payload/WebhookApp.app/
          
          # יצירת קובץ Info.plist בסיסי
          cat << 'EOF' > Payload/WebhookApp.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>WebhookApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.myapp.webhook</string>
              <key>CFBundleName</key>
              <string>WebhookApp</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
          </dict>
          </plist>
          EOF

      - name: Zip into IPA
        run: |
          zip -r WebhookSender.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebhookSender-IPA
          path: WebhookSender.ipa
