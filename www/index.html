<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webhook Sender</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h2 {
            margin-bottom: 20px;
            color: #38bdf8;
            text-align: center;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            border-color: #38bdf8;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: #0369a1;
        }

        .btn:active {
            transform: scale(0.98);
        }

        #status {
            margin-top: 14px;
            font-size: 0.85rem;
            text-align: center;
            min-height: 20px;
        }

        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>

    <div class="card">
        <h2>שליחת Webhook</h2>
        
        <div class="input-group">
            <label for="webhookUrl">קישור Webhook:</label>
            <input type="url" id="webhookUrl" placeholder="https://..." autocomplete="off">
        </div>

        <div class="input-group">
            <label for="message">הודעה לשליחה:</label>
            <textarea id="message" placeholder="כתוב את ההודעה שלך כאן..."></textarea>
        </div>

        <button class="btn" onclick="sendMessage()">שלח הודעה</button>

        <div id="status"></div>
    </div>

    <script>
        // טעינת ה-Webhook שנשמר לפעמים קודמות
        document.addEventListener('DOMContentLoaded', () => {
            const savedUrl = localStorage.getItem('saved_webhook_url');
            if (savedUrl) {
                document.getElementById('webhookUrl').value = savedUrl;
            }
        });

        async function sendMessage() {
            const urlInput = document.getElementById('webhookUrl');
            const messageInput = document.getElementById('message');
            const statusDiv = document.getElementById('status');

            const url = urlInput.value.trim();
            const message = messageInput.value.trim();

            if (!url) {
                showStatus('נא להזין קישור Webhook', 'error');
                return;
            }

            if (!message) {
                showStatus('נא להזין הודעה לשליחה', 'error');
                return;
            }

            // שמירת ה-Webhook בזיכרון המקומי
            localStorage.setItem('saved_webhook_url', url);

            showStatus('שולח...', '');

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ content: message })
                });

                if (response.ok) {
                    showStatus('ההודעה נשלחה בהצלחה!', 'success');
                    messageInput.value = ''; // איפוס שדה ההודעה
                } else {
                    showStatus(`שגיאה בשליחה: ${response.status}`, 'error');
                }
            } catch (err) {
                showStatus('שגיאת רשת או Webhook לא תקין', 'error');
            }
        }

        function showStatus(msg, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = msg;
            statusDiv.className = type;
        }
    </script>
</body>
</html>
